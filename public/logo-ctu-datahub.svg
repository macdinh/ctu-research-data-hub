<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- 1. Màu TRUNG THỰC (Integrity & Scientific Truth): Xanh Dương Đại học Cần Thơ -->
    <linearGradient id="ctuTruthBlue" x1="10" y1="8" x2="110" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- 2. Màu CHIA SẺ (Open Sharing & Growth): Xanh Ngọc Lục Bảo Sông Hậu -->
    <linearGradient id="ctuShareEmerald" x1="20" y1="68" x2="100" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 3. Màu ĐOÀN KẾT (Solidarity & Unity): Vàng Hổ Phách Tỏa Sáng -->
    <linearGradient id="ctuUnityGold" x1="34" y1="24" x2="86" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Khối Khiên Tri Thức (Academic Shield - Trung thực & Vững bền) -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ctuTruthBlue)" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.35" />

  <!-- Vòng hào quang lục giác ẩn tượng trưng cho Cấu trúc Dữ liệu Chuẩn FAIR -->
  <polygon points="60,18 94,37 94,75 60,94 26,75 26,37" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.22" stroke-dasharray="4 3" />

  <!-- Đôi Cánh Trang Sách Mở & Sóng Nước Cửu Long (Tinh thần CHIA SẺ Tri thức mở) -->
  <path d="M24 76 C36 68, 49 72, 60 81 C71 72, 84 68, 96 76 L96 88 C84 80, 71 84, 60 93 C49 84, 36 80, 24 88 Z" fill="url(#ctuShareEmerald)" />
  <path d="M30 93 C42 87, 51 90, 60 97 C69 90, 78 87, 90 93" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Mạng lưới 3 Đỉnh Dữ liệu Hội tụ (Tinh thần ĐOÀN KẾT Sinh viên - Giảng viên - Nhà nghiên cứu) -->
  <!-- Các đường liên kết dữ liệu -->
  <line x1="60" y1="30" x2="37" y2="58" stroke="url(#ctuUnityGold)" stroke-width="4" stroke-linecap="round" />
  <line x1="60" y1="30" x2="83" y2="58" stroke="url(#ctuUnityGold)" stroke-width="4" stroke-linecap="round" />
  <line x1="37" y1="58" x2="83" y2="58" stroke="url(#ctuUnityGold)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 0" />
  <line x1="60" y1="30" x2="60" y2="75" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Tâm điểm Kết nối Tri thức Trung thực (Hạt nhân Khoa học) -->
  <circle cx="60" cy="52" r="5" fill="#FFFFFF" />

  <!-- 3 Nút Dữ liệu Đoàn kết (3 Pillars: Đoàn kết - Chia sẻ - Trung thực) -->
  <circle cx="60" cy="30" r="8.5" fill="url(#ctuUnityGold)" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="37" cy="58" r="7.5" fill="url(#ctuUnityGold)" stroke="#FFFFFF" stroke-width="2.2" />
  <circle cx="83" cy="58" r="7.5" fill="url(#ctuUnityGold)" stroke="#FFFFFF" stroke-width="2.2" />
</svg>
